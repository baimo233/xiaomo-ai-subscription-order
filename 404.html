<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小墨Lab</title>

    <script>
      try {
        if (localStorage.getItem('xiaomo-lab-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
        const locale = localStorage.getItem('xiaomo-lab-locale')
        if (locale) document.documentElement.lang = locale === 'en' ? 'en' : locale
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/xiaomo-ai-subscription-order/assets/index-C_boXKWQ.js"></script>

  <body>
    <div id="root">
      <style>.boot-skel{box-sizing:border-box;background:#f5f5f7;max-width:1280px;min-height:100svh;margin:0 auto;padding:88px 24px 64px}.boot-bone{background:linear-gradient(90deg,#ececef 0%,#f6f6f8 45%,#ececef 90%) 0 0/200% 100%;animation:1.35s infinite boot-shine}@keyframes boot-shine{0%{background-position:100% 0}to{background-position:-100% 0}}.boot-head{justify-content:space-between;align-items:flex-end;gap:16px;margin:32px 0;display:flex}.boot-title{border-radius:12px;width:160px;height:40px;margin:0 0 12px}.boot-sub{border-radius:8px;width:260px;height:14px}.boot-more{border-radius:8px;width:96px;height:14px}.boot-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;display:grid}.boot-card{background:#fff;border:1px solid #e8e8ea;border-radius:16px;overflow:hidden}.boot-cover{aspect-ratio:16/10}.boot-pad{padding:16px}.boot-s{border-radius:6px;height:12px;margin-bottom:10px}@media (width<=1024px){.boot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
      <div class="boot-skel" aria-busy="true">
        <div class="boot-head">
          <div>
            <div class="boot-bone boot-title"></div>
            <div class="boot-bone boot-sub"></div>
          </div>
          <div class="boot-bone boot-more"></div>
        </div>
        <div class="boot-grid">
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>

          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
        </div>
      </div>
    </div>

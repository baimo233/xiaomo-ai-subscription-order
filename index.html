<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小墨Lab</title>
    <meta name="description" content="小墨Lab · 精选 ChatGPT 会员，查看当前价格并下单。" />
    <script>
      try {
        if (localStorage.getItem('xiaomo-lab-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
        const locale = localStorage.getItem('xiaomo-lab-locale')
        if (locale) document.documentElement.lang = locale === 'en' ? 'en' : locale
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        .boot-skel{min-height:100svh;background:#f5f5f7;padding:88px 24px 64px;max-width:1280px;margin:0 auto;box-sizing:border-box}
        .boot-bone{background:linear-gradient(90deg,#ececef 0%,#f6f6f8 45%,#ececef 90%);background-size:200% 100%;animation:boot-shine 1.35s ease infinite}
        @keyframes boot-shine{0%{background-position:100% 0}100%{background-position:-100% 0}}
        .boot-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:32px 0 32px}
        .boot-title{width:160px;height:40px;border-radius:12px;margin:0 0 12px}
        .boot-sub{width:260px;height:14px;border-radius:8px}
        .boot-more{width:96px;height:14px;border-radius:8px}
        .boot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
        .boot-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e8e8ea}
        .boot-cover{aspect-ratio:16/10}
        .boot-pad{padding:16px}
        .boot-s{height:12px;border-radius:6px;margin-bottom:10px}
        @media (max-width:1024px){.boot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      </style>
      <div class="boot-skel" aria-busy="true">
        <div class="boot-head">
          <div>
            <div class="boot-bone boot-title"></div>
            <div class="boot-bone boot-sub"></div>
          </div>
          <div class="boot-bone boot-more"></div>
        </div>
        <div class="boot-grid">
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
          <div class="boot-card"><div class="boot-bone boot-cover"></div><div class="boot-pad"><div class="boot-bone boot-s"></div><div class="boot-bone boot-s" style="width:80%"></div></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
